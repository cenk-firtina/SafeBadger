<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgSade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e2e"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <!-- Arka Plan Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgSade)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4"/>

  <!-- Minimalist Geometrik Kalkan & Kilit -->
  <g transform="translate(256, 256)">
    <!-- Zarif Kalkan Çizgisi -->
    <path d="M 0 -130 L 115 -80 C 115 50 0 135 0 145 C 0 135 -115 50 -115 -80 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Asma Kilit Gövdesi ve Halkası -->
    <!-- Kilit Halkası -->
    <path d="M -30 -10 V -40 C -30 -58 -16 -70 0 -70 C 16 -70 30 -58 30 -40 V -10" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="14" 
          stroke-linecap="round"/>

    <!-- Kilit Gövdesi -->
    <rect x="-46" y="-12" width="92" height="74" rx="18" fill="#ffffff"/>

    <!-- Anahtar Deliği (Negatif Alan) -->
    <circle cx="0" cy="18" r="8" fill="#0b0f19"/>
    <path d="M -4 20 L -6 44 H 6 L 4 20 Z" fill="#0b0f19"/>
  </g>
</svg>
